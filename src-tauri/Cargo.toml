[package]
name = "markdown-viewer"
version = "0.1.0"
description = "A simple, fast Markdown viewer and editor for Windows"
authors = ["Bilal Abou Dargham"]
edition = "2021"

[lib]
name = "markdown_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7"
tauri-plugin-store = "2.4"
tauri-plugin-opener = "2.5"
tauri-plugin-window-state = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
