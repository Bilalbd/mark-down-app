[package]
name = "markdown-viewer"
version = "0.8.0"
description = "A simple, fast Markdown viewer and editor for Windows"
authors = ["Bilal Abou Dargham"]
edition = "2021"

[lib]
name = "markdown_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-dialog = "2.7"
tauri-plugin-store = "2.4"
tauri-plugin-opener = "2.5"
tauri-plugin-window-state = "2.4"
notify = "8"
notify-debouncer-full = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2.3.2"
tauri-plugin-single-instance = "2"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
